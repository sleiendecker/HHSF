# Where each dataset comes from. Endpoints change; keep them here, not in code.
tiger_counties:
  description: US Census TIGERweb county boundaries
  url: https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer/1/query
  license: Public domain (US Government work)
  version: TIGERweb current

nhdplus_hr:
  description: >-
    USGS NHDPlus High Resolution network flowlines with value-added attributes.
    Final release; frozen since USGS moved to the 3D Hydrography Program (3DHP).
  url: https://hydro.nationalmap.gov/arcgis/rest/services/NHDPlus_HR/MapServer/3/query
  license: Public domain (US Government work)
  version: NHDPlus HR final release (MapServer)
