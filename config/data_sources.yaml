# Where each dataset comes from. Endpoints change; keep them here, not in code.

# Where `hhsf ingest hydrography` gets streams by default (override with --source):
#   bulk:    download one NHDPlus HR file per HU4 region (fast, reliable; default)
#   service: query the USGS web service box by box (slow, often times out)
hydrography_source: bulk

tiger_counties:
  description: US Census TIGERweb county boundaries
  url: https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer/1/query
  license: Public domain (US Government work)
  version: TIGERweb current

nhdplus_hr:
  description: >-
    USGS NHDPlus High Resolution network flowlines with value-added attributes.
    Final release; frozen since USGS moved to the 3D Hydrography Program (3DHP).
  url: https://hydro.nationalmap.gov/arcgis/rest/services/NHDPlus_HR/MapServer/3/query
  license: Public domain (US Government work)
  version: NHDPlus HR final release (MapServer)

nhdplus_hr_bulk:
  description: >-
    USGS NHDPlus High Resolution file geodatabases, one zip per HU4 region
    (NHDFlowline + NHDPlusFlowlineVAA + NHDPlusEROMMA). The "VPU/Current" folder holds
    the release the MapServer serves; the older "Beta" folder has different IDs in places.
  url: https://prd-tnm.s3.amazonaws.com/StagedProducts/Hydrography/NHDPlusHR/VPU/Current/GDB/
  license: Public domain (US Government work)
  version: NHDPlus HR final release (HU4 file geodatabase)

wbd_hu4:
  description: >-
    USGS Watershed Boundary Dataset HU4 regions. Only used to work out which
    NHDPlus HR files cover an AOI that doesn't list its huc4 codes.
  url: https://hydro.nationalmap.gov/arcgis/rest/services/wbd/MapServer/2/query
  license: Public domain (US Government work)
  version: WBD current

streamstats:
  description: >-
    USGS StreamStats: watershed delineation, basin characteristics and the Tennessee
    regional regression equations (Law and others, SIR 2009-5159) for low-flow and
    flow-duration statistics. Used for firm (Q90) flow; see docs/ASSUMPTIONS.md.
  url: https://streamstats.usgs.gov/
  license: Public domain (US Government work)
  version: ss-delineate v1.2.0, ss-hydro v1, NSS services (checked 2026-10-18)
  # The four calls per pour point, in order (USGS "Flow Statistics Workflow", Jan 2026).
  # The older /streamstatsservices/ endpoints are gone (404).
  endpoints:
    delineate: https://streamstats.usgs.gov/ss-delineate/v1/delineate/sshydro/{region}  # GET ?lat=&lon=
    regression_regions: https://streamstats.usgs.gov/nssservices/regressionregions/bylocation  # POST watershed geometry
    scenarios: https://streamstats.usgs.gov/nssservices/scenarios  # GET ?regions=&statisticgroups=&regressionregions=
    basin_characteristics: https://streamstats.usgs.gov/ss-hydro/v1/basin-characteristics/calculate  # POST delineation response
    estimate: https://streamstats.usgs.gov/nssservices/scenarios/estimate  # POST ?regions=
  # USGS asks for "no more than four simultaneous requests" and may change enforcement
  # at any time. No numeric per-second limit is published and no rate-limit headers
  # are returned. Each pour point is ~4 calls of ~3-4 s each.
  max_concurrent_requests: 4
  timeout_s: 120
  retries: 2
  # Stop calling StreamStats for the rest of a run after this many reaches in a row
  # fail because the service is down (502, timeouts); they fall back to NHDPlus EROM.
  max_consecutive_failures: 3

nwis:
  description: >-
    USGS NWIS daily mean discharge (parameter 00060) and site info, for the
    reference gauge's measured Q90. USGS is moving these "waterservices" endpoints
    to api.waterdata.usgs.gov; switch there if they stop answering.
  url: https://waterservices.usgs.gov/nwis/
  license: Public domain (US Government work)
  version: NWIS daily values, approved data only
  daily_values: https://waterservices.usgs.gov/nwis/dv/
  site: https://waterservices.usgs.gov/nwis/site/

wbd_hu8:
  description: >-
    USGS Watershed Boundary Dataset HUC8 subbasins. Decides which reaches drain
    to the reference gauge's basin.
  url: https://hydro.nationalmap.gov/arcgis/rest/services/wbd/MapServer/4/query
  license: Public domain (US Government work)
  version: WBD current

usgs_3dep_13:
  description: >-
    USGS 3D Elevation Program (3DEP) seamless DEM, 1/3 arc-second (~10 m), NAVD88
    meters, as 1x1 degree cloud-optimized GeoTIFF tiles named by their north-west
    corner (n36w086 covers 35-36 N, 85-86 W). Only the part of each tile under the
    AOI's streams is read (HTTP range requests) and saved to data/raw/usgs_3dep_13/.
  url: https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/13/TIFF/current/
  license: Public domain (US Government work)
  version: 3DEP 1/3 arc-second, current tiles  # the ingest adds each tile's last-modified date

mrlc_nlcd:
  description: >-
    USGS National Land Cover Database (NLCD) 2021 land cover, 30 m, and the USFS NLCD tree
    canopy cover 2021 (percent of each 30 m cell under tree crowns), from the Multi-Resolution
    Land Characteristics Consortium's coverage service (WCS) in Albers equal-area (EPSG:5070,
    the analysis projection). Only a box around the AOI's turbine parcels is downloaded,
    cached in data/raw/mrlc_nlcd/<aoi>/. Used for what each turbine parcel is now: open
    field, forest or built up (PART 20); see docs/ASSUMPTIONS.md, "Land cover".
  url: https://www.mrlc.gov/geoserver/mrlc_download/wcs
  license: >-
    Public domain (US Government work: USGS and USFS, via MRLC). Cite as "U.S. Geological
    Survey, National Land Cover Database 2021" and "USDA Forest Service, NLCD Tree Canopy
    Cover 2021". Classified from 30 m Landsat imagery: a planning screen, not a survey.
  version: NLCD 2021 Land Cover (CONUS); NLCD Tree Canopy Cover 2021 (v2021-4)
  coverages:
    land_cover: mrlc_download__NLCD_2021_Land_Cover_L48
    tree_canopy: mrlc_download__nlcd_tcc_conus_2021_v2021-4
  year: 2021

ms_buildings:
  description: >-
    Microsoft Global ML Building Footprints: outlines of buildings traced by a machine
    learning model from Bing aerial imagery (imagery mostly 2014-2023), one gzipped GeoJSON
    file per zoom 9 web-map tile ("quadkey"), listed in the CSV at `url`. Far more complete in
    rural Tennessee than OpenStreetMap. No use (house, barn, shed) or address: just the
    outline and sometimes a height estimate. Used for neighbors near each home site (PART 21,
    FR-6 privacy); see docs/ASSUMPTIONS.md, "Privacy".
  url: https://minedbuildings.z5.web.core.windows.net/global-buildings/dataset-links.csv
  license: >-
    Open Data Commons Open Database License (ODbL 1.0), (c) Microsoft. Attribute Microsoft;
    a database made from it must be shared under the ODbL too.
  version: Global ML Building Footprints  # the ingest adds the release date from the file links
  region: UnitedStates   # the link list's Location
  zoom: 9                # its tiles' zoom level
  pad_m: 2000            # tiles touching the county plus this margin are loaded

fema_nfhl:
  description: >-
    FEMA National Flood Hazard Layer (NFHL), "Flood Hazard Zones" (layer 28, the S_FLD_HAZ_AR
    table): the effective flood maps (FIRMs) as polygons, each with its zone (A, AE, X, ...),
    subtype (floodway, 0.2% annual chance, minimal hazard) and whether it's a Special Flood
    Hazard Area (SFHA, the 1% annual chance or "100-year" floodplain). Effective maps only;
    preliminary and pending ones are a separate service and aren't used.
  url: https://hazards.fema.gov/arcgis/rest/services/public/NFHL/MapServer/28/query
  service: https://hazards.fema.gov/arcgis/rest/services/public/NFHL/MapServer
  license: >-
    US Government work (FEMA), generally public domain; FEMA's service page states no license
    or terms of use. FEMA cautions that maps shown with other data for official purposes need
    base data meeting its accuracy standards: here they're a planning screen, not a flood
    determination (that takes the FIRM panel itself, or a Letter of Map Amendment).
  attribution: FEMA National Flood Hazard Layer
  # Coverage checked 2026-10-20 (FIRM Panels, layer 3): all five counties have a countywide
  # digital flood map, Rhea 2008, Marion 2009, Grundy 2009, Sequatchie 2010 and Bledsoe 2010,
  # with some panels revised as late as 2025-11-27; zones cover 99.7-99.9% of each county.
  # Grundy's map has few studied streams (7 zone polygons). Small creeks are mostly left
  # unstudied, inside zone X. See docs/ASSUMPTIONS.md, "Flood zones".
  version: NFHL effective, ArcGIS MapServer 11.1 (checked 2026-10-20)
  # Pages are kept small: the server drops connections on large responses and under load
  # (the client retries). It also answers 403 to requests with no User-Agent.
  page_size: 100

# Map basemaps. The map app can't read this file: the URLs are copied in frontend/src/basemaps.ts,
# so change both together.
openfreemap_positron:
  description: >-
    OpenFreeMap "positron" vector style, the map's Light basemap (and the place and road
    names drawn over the Satellite one). Free, no API key.
  url: https://tiles.openfreemap.org/styles/positron
  license: ODbL (OpenStreetMap data); OpenMapTiles schema
  attribution: OpenFreeMap © OpenMapTiles Data from OpenStreetMap  # comes with the style
  version: OpenFreeMap current planet tiles

usgs_national_map_basemaps:
  description: >-
    USGS The National Map cached basemap tiles, the map's Satellite and Topo basemaps.
    ArcGIS REST tile cache in Web Mercator, 256 px JPEG tiles, row before column in the URL.
    Tiles stop at zoom 16 (1:9,028; zoom 17 returns 404), so the map stretches zoom 16 past that.
    Free, no API key, CORS open.
  url: https://basemap.nationalmap.gov/arcgis/rest/services/
  tiles: https://basemap.nationalmap.gov/arcgis/rest/services/{service}/MapServer/tile/{z}/{y}/{x}
  max_zoom: 16
  license: Public domain (US Government work)
  version: checked 2026-10-19
  services:
    USGSImageryOnly:
      use: Satellite
      contents: >-
        Orthoimagery, mostly USDA NAIP 1 m leaf-on aerial photos (2017-2021 for CONUS per the
        service description); Landsat and Blue Marble at small scales.
      attribution: "USGS The National Map: Orthoimagery"  # service copyright: "USDA, USGS The National Map: Orthoimagery. Data refreshed June, 2024"
    USGSTopo:
      use: Topo
      contents: >-
        US Topo style map from National Map data: contours and shaded relief (3DEP), names,
        roads, hydrography, boundaries, land cover.
      attribution: "USGS The National Map: US Topo"  # service data refreshed September 4, 2026
    USGSShadedReliefOnly:
      use: not used yet; a plain terrain option if topo is too busy (same URL pattern)
      attribution: "USGS The National Map: 3D Elevation Program"

catoosa_parcels:
  description: >-
    Catoosa County, GA zoning layer (Planning & Zoning, ArcGIS Online): one outline per
    parcel of unincorporated Catoosa with its parcel number, searchable in the county's
    Zoning Viewer. Ringgold and Fort Oglethorpe aren't in it. No owner names.
  url: https://services5.arcgis.com/UWegEIVn0JwnAZjA/arcgis/rest/services/ZoningFeatureLayer_withDescriptions_Feb2026_view/FeatureServer/83/query
  item: https://experience.arcgis.com/experience/ea458edb5a9b4e729642031c221a20dd
  license: >-
    Public ArcGIS Online layer of Catoosa County. No terms of use published with it (checked
    2026-10-27). Zoning outlines, not surveyed boundaries or legal descriptions.
  version: ZoningFeatureLayer_withDescriptions_Feb2026 (last update 2026-02-23)
  page_size: 2000

whitfield_parcels:
  description: >-
    Whitfield County, GA GIS parcels (Parcels_and_Development map service, layer 4), with
    the owner as the tax digest writes it, which `hhsf ingest parcels` saves to
    parcel_owners only.
  url: https://gis.whitfieldcountyga.com/server/rest/services/Parcels_and_Development/MapServer/4/query
  item: https://gis.whitfieldcountyga.com/GIS/Indexgis.htm
  license: >-
    The county says the GIS information available to the public is "free of charge for
    unlimited use" (gis.whitfieldcountyga.com/GIS/assistance.html, checked 2026-10-27), and
    that much of it is still under development or outdated. No warranty; owner names kept
    in local exports only.
  version: Parcels_and_Development (checked 2026-10-27)
  # The service returns at most 1,000 features a query.
  page_size: 1000

hamilton_parcels:
  description: >-
    Hamilton County, TN GIS parcel boundaries (Live_Parcels map service, layer 0), for
    the county the state layer leaves out. Same GISLINK keys as the state layer. The
    layer holds the owner names, so `hhsf ingest parcels` saves those to parcel_owners
    only, as for the state layer.
  url: https://mapsdev.hamiltontn.gov/hcwa03/rest/services/Live_Parcels/MapServer/0/query
  item: https://gismaps.hamiltontn.gov/hcgis
  license: >-
    Public map service of Hamilton County GIS (the one its map viewer reads). No terms of use
    published with it (checked 2026-10-26); treat it like the state layer: no warranty, not
    legal descriptions, owner names kept in local exports only.
  version: Live_Parcels (checked 2026-10-26)
  # The service returns at most 1,000 features a query.
  page_size: 1000

tn_parcels:
  description: >-
    Tennessee Comptroller of the Treasury statewide parcel boundaries ("Tennessee Property
    Boundaries Public Use", ArcGIS Online feature service on TNMap). 86 counties, updated
    monthly; Chester, Davidson, Hamilton, Hickman, Knox, Montgomery, Rutherford, Shelby and
    Williamson keep their own parcels and aren't in it. The layer holds the owner names, so
    `hhsf ingest parcels` saves those to a separate table (parcel_owners) that the map never
    serves; see docs/ASSUMPTIONS.md, "Parcels and owners".
  url: https://services1.arcgis.com/YuVBSS7Y1of2Qud1/arcgis/rest/services/Tennessee_Property_Boundaries_Public_Use/FeatureServer/0/query
  item: https://www.arcgis.com/home/item.html?id=e356f1a241844d6f9025f2fa4e977df3
  license: >-
    Public service, "not intended for commercial use" (the Comptroller's per-county shapefile
    downloads are the commercial route). No warranty; graphical reference only, not legal
    descriptions or boundary lines. Owner names are personal information: keep them in local
    exports only, never in map tiles, the repo or anything shared.
  attribution: Tennessee Comptroller of the Treasury, Division of Property Assessments
  version: TNMap statewide parcels, monthly update (checked 2026-10-20)
  # The layer numbers counties alphabetically (Bledsoe 4, Sequatchie 77). That is
  # (county FIPS + 1) / 2, since Tennessee's county FIPS codes are the odd numbers 1-189.
  page_size: 2000  # the service's maxRecordCount
  # Per-county shapefiles with the full assessment table (mailing address, values) come
  # through a form on this page, by hand only; not used.
  downloads: https://comptroller.tn.gov/office-functions/pa/gisredistricting/redistricting-and-land-use-maps/parcel-data.html

tiger_roads:
  description: >-
    US Census Bureau TIGER/Line roads, one shapefile per county (all roads, named or not,
    with the Census feature class MTFCC). Used for each turbine end's nearest road and its
    type. Walkways, stairs, bike and bridle paths, and S1750 lines ("internal Census Bureau
    use") aren't loaded; see hhsf.ingest.roads. TIGER misses most driveways and many
    logging roads and farm tracks, so "nearest road" can be farther than the real access.
  url: https://www2.census.gov/geo/tiger/TIGER2025/ROADS/
  file_url: https://www2.census.gov/geo/tiger/TIGER{year}/ROADS/tl_{year}_{geoid}_roads.zip
  year: 2025  # TIGER/Line comes out yearly (around September); bump to switch releases
  license: Public domain (US Government work)
  attribution: US Census Bureau TIGER/Line
  version: TIGER/Line 2025 (files dated 2025-09)

osm_valhalla:
  description: >-
    Drive times and the 1-hour drive area from Chattanooga (D-02), computed by Valhalla, an
    open-source routing engine running locally in Docker (`make routing`), on OpenStreetMap
    road data for Tennessee, Georgia and Alabama (Geofabrik daily extracts, downloaded once
    into data/valhalla/). Car profile, no traffic. The extract URLs are set in
    docker-compose.yml (the `routing` service's tile_urls); the origin and minutes in
    config/drive_time.yaml.
  url: https://download.geofabrik.de/north-america/us/
  engine: https://github.com/valhalla/valhalla
  license: >-
    OpenStreetMap data is ODbL 1.0 (© OpenStreetMap contributors): credit it wherever the
    drive-time area or drive times are shown. The area and times are a "produced work",
    free to share with the credit; the road data itself, or a database built from it,
    is share-alike (ODbL) if passed on. Valhalla is MIT licensed.
  attribution: © OpenStreetMap contributors
  version: Valhalla 3.9.1 on Geofabrik extracts  # the run records the road graph's build date

usda_ssurgo:
  description: >-
    USDA NRCS Soil Survey Geographic database (SSURGO), read through Soil Data Access (SDA),
    NRCS's SQL web service over the same database Web Soil Survey shows. Per county survey
    area (Sequatchie is TN153: "TN" + county FIPS): the soil map unit polygons, each map
    unit's components with their septic ratings, and a few map unit summaries (hydric share,
    depth to bedrock and to the water table, flooding frequency, drainage class). Used for
    septic suitability in the buildable-land step (PART 17); see docs/ASSUMPTIONS.md,
    "Buildable ground". Also each map unit's farmland class, non-irrigated land capability
    class and its main component's pasture yield, for the farmland step (PART 18); see
    "Farmland".
  url: https://sdmdataaccess.sc.egov.usda.gov/Tabular/post.rest
  service: https://sdmdataaccess.nrcs.usda.gov/
  license: >-
    Public domain (US Government work, USDA NRCS). NRCS asks to be cited as "Soil Survey
    Staff, Natural Resources Conservation Service, United States Department of Agriculture.
    Soil Survey Geographic (SSURGO) Database." Mapped at 1:12,000 to 1:24,000: a map unit
    can hold small areas of other soils, so a rating is a planning screen, not a site
    evaluation (Tennessee permits septic systems on a soil scientist's on-site evaluation).
  attribution: USDA NRCS Soil Survey Geographic (SSURGO) Database
  version: SSURGO via Soil Data Access  # the ingest adds each survey area's version and date
  # Septic ratings: SSURGO has two (checked 2026-10-21). The national "ENG - Septic Tank
  # Absorption Fields" rates about 3 in 4 major soils here Very limited (bedrock within
  # 100 cm, slope over 15%, flooding). The Tennessee "ENG - Conventional On-Site Septic
  # Systems (TN)" approximates the state's own rules (TDEC chapter 0400-48-01, formerly
  # 1200-01-06) and leaves flooding to be judged separately; about half are Very limited.
  # Both are saved; config/buildability.yaml picks which one counts (the Tennessee one).
  septic_rules:
    septic_tn: ENG - Conventional On-Site Septic Systems (TN)
    septic_national: ENG - Septic Tank Absorption Fields
  # SDA caps a response at 100,000 rows or about 32 MB; 1,000 polygons is ~3 MB.
  page_size: 1000
