# Where each dataset comes from. Endpoints change; keep them here, not in code.

# Where `hhsf ingest hydrography` gets streams by default (override with --source):
#   bulk:    download one NHDPlus HR file per HU4 region (fast, reliable; default)
#   service: query the USGS web service box by box (slow, often times out)
hydrography_source: bulk

tiger_counties:
  description: US Census TIGERweb county boundaries
  url: https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer/1/query
  license: Public domain (US Government work)
  version: TIGERweb current

nhdplus_hr:
  description: >-
    USGS NHDPlus High Resolution network flowlines with value-added attributes.
    Final release; frozen since USGS moved to the 3D Hydrography Program (3DHP).
  url: https://hydro.nationalmap.gov/arcgis/rest/services/NHDPlus_HR/MapServer/3/query
  license: Public domain (US Government work)
  version: NHDPlus HR final release (MapServer)

nhdplus_hr_bulk:
  description: >-
    USGS NHDPlus High Resolution file geodatabases, one zip per HU4 region
    (NHDFlowline + NHDPlusFlowlineVAA + NHDPlusEROMMA). The "VPU/Current" folder holds
    the release the MapServer serves; the older "Beta" folder has different IDs in places.
  url: https://prd-tnm.s3.amazonaws.com/StagedProducts/Hydrography/NHDPlusHR/VPU/Current/GDB/
  license: Public domain (US Government work)
  version: NHDPlus HR final release (HU4 file geodatabase)

wbd_hu4:
  description: >-
    USGS Watershed Boundary Dataset HU4 regions. Only used to work out which
    NHDPlus HR files cover an AOI that doesn't list its huc4 codes.
  url: https://hydro.nationalmap.gov/arcgis/rest/services/wbd/MapServer/2/query
  license: Public domain (US Government work)
  version: WBD current

streamstats:
  description: >-
    USGS StreamStats: watershed delineation, basin characteristics and the Tennessee
    regional regression equations (Law and others, SIR 2009-5159) for low-flow and
    flow-duration statistics. Used for firm (Q90) flow; see docs/ASSUMPTIONS.md.
  url: https://streamstats.usgs.gov/
  license: Public domain (US Government work)
  version: ss-delineate v1.2.0, ss-hydro v1, NSS services (checked 2026-10-18)
  # The four calls per pour point, in order (USGS "Flow Statistics Workflow", Jan 2026).
  # The older /streamstatsservices/ endpoints are gone (404).
  endpoints:
    delineate: https://streamstats.usgs.gov/ss-delineate/v1/delineate/sshydro/{region}  # GET ?lat=&lon=
    regression_regions: https://streamstats.usgs.gov/nssservices/regressionregions/bylocation  # POST watershed geometry
    scenarios: https://streamstats.usgs.gov/nssservices/scenarios  # GET ?regions=&statisticgroups=&regressionregions=
    basin_characteristics: https://streamstats.usgs.gov/ss-hydro/v1/basin-characteristics/calculate  # POST delineation response
    estimate: https://streamstats.usgs.gov/nssservices/scenarios/estimate  # POST ?regions=
  # USGS asks for "no more than four simultaneous requests" and may change enforcement
  # at any time. No numeric per-second limit is published and no rate-limit headers
  # are returned. Each pour point is ~4 calls of ~3-4 s each.
  max_concurrent_requests: 4
  timeout_s: 120
  retries: 2
  # Stop calling StreamStats for the rest of a run after this many reaches in a row
  # fail because the service is down (502, timeouts); they fall back to NHDPlus EROM.
  max_consecutive_failures: 3

nwis:
  description: >-
    USGS NWIS daily mean discharge (parameter 00060) and site info, for the
    reference gauge's measured Q90. USGS is moving these "waterservices" endpoints
    to api.waterdata.usgs.gov; switch there if they stop answering.
  url: https://waterservices.usgs.gov/nwis/
  license: Public domain (US Government work)
  version: NWIS daily values, approved data only
  daily_values: https://waterservices.usgs.gov/nwis/dv/
  site: https://waterservices.usgs.gov/nwis/site/

wbd_hu8:
  description: >-
    USGS Watershed Boundary Dataset HUC8 subbasins. Decides which reaches drain
    to the reference gauge's basin.
  url: https://hydro.nationalmap.gov/arcgis/rest/services/wbd/MapServer/4/query
  license: Public domain (US Government work)
  version: WBD current

usgs_3dep_13:
  description: >-
    USGS 3D Elevation Program (3DEP) seamless DEM, 1/3 arc-second (~10 m), NAVD88
    meters, as 1x1 degree cloud-optimized GeoTIFF tiles named by their north-west
    corner (n36w086 covers 35-36 N, 85-86 W). Only the part of each tile under the
    AOI's streams is read (HTTP range requests) and saved to data/raw/usgs_3dep_13/.
  url: https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/13/TIFF/current/
  license: Public domain (US Government work)
  version: 3DEP 1/3 arc-second, current tiles  # the ingest adds each tile's last-modified date

# Map basemaps. The map app can't read this file: the URLs are copied in frontend/src/basemaps.ts,
# so change both together.
openfreemap_positron:
  description: >-
    OpenFreeMap "positron" vector style, the map's Light basemap (and the place and road
    names drawn over the Satellite one). Free, no API key.
  url: https://tiles.openfreemap.org/styles/positron
  license: ODbL (OpenStreetMap data); OpenMapTiles schema
  attribution: OpenFreeMap © OpenMapTiles Data from OpenStreetMap  # comes with the style
  version: OpenFreeMap current planet tiles

usgs_national_map_basemaps:
  description: >-
    USGS The National Map cached basemap tiles, the map's Satellite and Topo basemaps.
    ArcGIS REST tile cache in Web Mercator, 256 px JPEG tiles, row before column in the URL.
    Tiles stop at zoom 16 (1:9,028; zoom 17 returns 404), so the map stretches zoom 16 past that.
    Free, no API key, CORS open.
  url: https://basemap.nationalmap.gov/arcgis/rest/services/
  tiles: https://basemap.nationalmap.gov/arcgis/rest/services/{service}/MapServer/tile/{z}/{y}/{x}
  max_zoom: 16
  license: Public domain (US Government work)
  version: checked 2026-10-19
  services:
    USGSImageryOnly:
      use: Satellite
      contents: >-
        Orthoimagery, mostly USDA NAIP 1 m leaf-on aerial photos (2017-2021 for CONUS per the
        service description); Landsat and Blue Marble at small scales.
      attribution: "USGS The National Map: Orthoimagery"  # service copyright: "USDA, USGS The National Map: Orthoimagery. Data refreshed June, 2024"
    USGSTopo:
      use: Topo
      contents: >-
        US Topo style map from National Map data: contours and shaded relief (3DEP), names,
        roads, hydrography, boundaries, land cover.
      attribution: "USGS The National Map: US Topo"  # service data refreshed September 4, 2026
    USGSShadedReliefOnly:
      use: not used yet; a plain terrain option if topo is too busy (same URL pattern)
      attribution: "USGS The National Map: 3D Elevation Program"
