# Area of interest: one county. Add more AOIs as new files; no code changes needed.
key: sequatchie_tn
name: Sequatchie County, TN
county_geoid: "47153"   # state FIPS 47 + county FIPS 153
# Streams that touch the county within this distance are kept, so reaches
# crossing the county line aren't cut off.
buffer_m: 500
# NHDPlus HR regions (HU4) the county spans: Cumberland (Collins River side) and
# Middle Tennessee-Hiwassee (Sequatchie River side). Optional; looked up if missing.
huc4: ["0513", "0602"]
# Stream gauge whose measured low flow is scaled to reaches in its basin when
# StreamStats can't give a Q90. Only reaches inside the gauge's 8-digit basin
# (HUC8) use it. The Collins River side and Walden Ridge's Tennessee River slope
# (HUC8 06020001) aren't covered.
reference_gauge:
  site_no: "03571000"       # Sequatchie River near Whitwell, TN (402 sq mi)
  huc8: "06020004"          # Sequatchie
