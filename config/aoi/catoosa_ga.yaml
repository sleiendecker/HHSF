# Area of interest: Catoosa County, GA (see sequatchie_tn.yaml for what each field means).
# All of it is inside the 1-hour drive from downtown Chattanooga (D-02).
key: catoosa_ga
name: Catoosa County, GA
county_geoid: "13047"   # state FIPS 13 + county FIPS 047
buffer_m: 500
# The county's zoning layer: unincorporated parcels, no owner names (data_sources.yaml).
parcel_source: catoosa_parcels

# No StreamStats low flows in Georgia: every stream gets the regional yield of its basin,
# from the Tennessee streams of the Valley and Ridge next door (D-19).
streamstats: false
yield_from: [hamilton_tn, bradley_tn]
