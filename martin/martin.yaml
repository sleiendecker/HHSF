# Vector tile sources for the map. Each table is published explicitly.

# No tile cache: data changes whenever an ingest runs, and cached tiles would
# keep showing the old (or empty) map until the server restarts.
cache_size_mb: 0

postgres:
  connection_string: ${DATABASE_URL}
  auto_publish: false
  tables:
    streams:
      schema: public
      table: streams
      srid: 4326
      geometry_column: geom
      geometry_type: MULTILINESTRING
      id_column: stream_id
      properties:
        stream_name: text
        stream_order: int2
        length_m: float8
        drainage_area_sqkm: float8
        max_elev_m: float8
        min_elev_m: float8
        slope: float8
        mean_flow_cfs: float8
    # Property outlines from the Tennessee Comptroller (migration 0010). Owner names live
    # in parcel_owners, which is personal information: never list it here, and never
    # add owner or address columns to this layer (tests/unit/test_martin_config.py checks).
    # From zoom 12 only: the five counties hold ~80,000 parcels.
    parcels:
      schema: public
      table: parcels
      srid: 4326
      geometry_column: geom
      geometry_type: MULTIPOLYGON
      # No id_column: vector tile feature IDs must be integers, and the key (gislink) is text.
      minzoom: 12
      properties:
        parcel_id: text
        county_name: text
        acres: float8
        deed_acres: float8
    counties:
      schema: public
      table: counties
      srid: 4326
      geometry_column: geom
      geometry_type: MULTIPOLYGON
      id_column: county_id
      properties:
        county_name: text
    # The latest score run's corridors (a view, migrations 0005-0009): each one is the
    # steepest stretch of a reach (D-08), so only that stretch is drawn. The map colors
    # them by `hydro_score` and styles them by `tier`: medium, low, low_flow, head_only,
    # or empty for corridors that were filtered out. One row per reach across all AOIs;
    # `rank` counts within the AOI named by `aoi_name`. The turbine_parcel_* columns are the
    # parcel at the bottom of the stretch (migration 0010); no owner fields, ever. `factors` is JSON text: each
    # factor's value, sub-score, weight and contribution, for the click popup.
    latest_hydro_scores:
      schema: public
      table: latest_hydro_scores
      srid: 4326
      geometry_column: geom
      geometry_type: MULTILINESTRING
      id_column: corridor_id
      properties:
        score_run_id: int8
        nhdplusid: int8
        stream_name: text
        status: text
        tier: text
        rank: int4
        tier_rank: int4
        hydro_score: float8
        head_subscore: float8
        power_subscore: float8
        net_head_ft: float8
        firm_power_w: float8
        firm_flow_cfs: float8
        flow_method: text
        flow_confidence: text
        summary: text
        flow_flags: text
        flow_reference_gauge: text
        factors: text
        head_method: text
        corridor_length_m: float8
        reach_length_m: float8
        reach_drop_m: float8
        aoi_key: text
        aoi_name: text
        turbine_parcel_id: text
        turbine_parcel_acres: float8
        turbine_parcel_deed_acres: float8
        turbine_parcel_distance_m: float8
        parcels_crossed: int4
