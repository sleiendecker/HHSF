# Vector tile sources for the map. Each table is published explicitly.

# No tile cache: data changes whenever an ingest runs, and cached tiles would
# keep showing the old (or empty) map until the server restarts.
cache_size_mb: 0

postgres:
  connection_string: ${DATABASE_URL}
  auto_publish: false
  tables:
    streams:
      schema: public
      table: streams
      srid: 4326
      geometry_column: geom
      geometry_type: MULTILINESTRING
      id_column: stream_id
      properties:
        stream_name: text
        stream_order: int2
        length_m: float8
        drainage_area_sqkm: float8
        max_elev_m: float8
        min_elev_m: float8
        slope: float8
        mean_flow_cfs: float8
    # Property outlines from the Tennessee Comptroller (migration 0010). Owner names live
    # in parcel_owners, which is personal information: never list it here, and never
    # add owner or address columns to this layer (tests/unit/test_martin_config.py checks).
    # From zoom 12 only: the five counties hold ~80,000 parcels.
    parcels:
      schema: public
      table: parcels
      srid: 4326
      geometry_column: geom
      geometry_type: MULTIPOLYGON
      # No id_column: vector tile feature IDs must be integers, and the key (gislink) is text.
      minzoom: 12
      properties:
        parcel_id: text
        county_name: text
        acres: float8
        deed_acres: float8
    # FEMA flood zones (migration 0011), stored in pieces that keep FEMA's zone ID
    # (fld_ar_id). `sfha` marks the 1% annual chance ("100-year") floodplain. The map draws
    # floodways, SFHAs and 0.2% annual chance areas, not the minimal-hazard zone X.
    flood_zones:
      schema: public
      table: flood_zones
      srid: 4326
      geometry_column: geom
      geometry_type: MULTIPOLYGON
      id_column: flood_zone_id
      minzoom: 10
      properties:
        fld_ar_id: text
        zone: text
        subtype: text
        sfha: bool
        floodway: bool
    # Drivable roads from Census TIGER/Line (migration 0012), with their Census class
    # (`road_class`: primary, secondary, local, 4wd_trail, private, ...). From zoom 10.
    roads:
      schema: public
      table: roads
      srid: 4326
      geometry_column: geom
      geometry_type: MULTILINESTRING
      id_column: road_id
      minzoom: 10
      properties:
        name: text
        road_class: text
        public: bool
    # The area within the D-02 drive of downtown Chattanooga, from Valhalla (0012).
    drive_time_areas:
      schema: public
      table: drive_time_areas
      srid: 4326
      geometry_column: geom
      geometry_type: MULTIPOLYGON
      id_column: area_id
      properties:
        origin_name: text
        minutes: int4
    # USDA SSURGO soil map units (migration 0013), stored in pieces that keep the polygon's
    # key. `septic_tn` is the Tennessee septic rating (dominant condition), the one the
    # buildable-ground step uses; `septic_national` the national one. `farmland_class`,
    # `capability_class` (non-irrigated, 1-8) and `pasture_aum` (AUM per acre a year) are
    # for farmland (0014). From zoom 11.
    soils:
      schema: public
      table: soils
      srid: 4326
      geometry_column: geom
      geometry_type: MULTIPOLYGON
      id_column: soil_id
      minzoom: 11
      properties:
        musym: text
        muname: text
        septic_tn: text
        septic_national: text
        hydric_pct: float8
        bedrock_min_cm: float8
        flooding: text
        drainage: text
        farmland_class: text
        capability_class: int2
        pasture_aum: float8
    # Buildable ground on each turbine parcel (0013): gently sloped, outside the 100-year
    # floodplain, on septic-suitable soils, in patches big enough for a homestead
    # (config/buildability.yaml). One multipolygon per parcel. From zoom 11.
    parcel_buildable:
      schema: public
      table: parcel_buildable
      srid: 4326
      geometry_column: geom
      geometry_type: MULTIPOLYGON
      # No id_column: the key (gislink) is text.
      minzoom: 11
      properties:
        buildable_acres: float8
        gentle_acres: float8
        parcel_acres: float8
        patches: int4
        max_slope_pct: float8
    counties:
      schema: public
      table: counties
      srid: 4326
      geometry_column: geom
      geometry_type: MULTIPOLYGON
      id_column: county_id
      properties:
        county_name: text
    # The latest score run's corridors (a view, migrations 0005-0009): each one is the
    # steepest stretch of a reach (D-08), so only that stretch is drawn. The map colors
    # them by `hydro_score` and styles them by `tier`: medium, low, low_flow, head_only,
    # or empty for corridors that were filtered out. One row per reach across all AOIs;
    # `rank` counts within the AOI named by `aoi_name`. The turbine_parcel_* columns are the
    # parcel at the bottom of the stretch (migration 0010); no owner fields, ever. The
    # turbine_flood_* columns are the FEMA zone there, and stretch_sfha_m how much of the
    # stretch is in the 100-year floodplain (0011). turbine_road_* is the nearest TIGER road
    # to the turbine end and turbine_public_road_m the nearest public one; drive_minutes and
    # drive_km the drive from downtown Chattanooga, and in_drive_area whether the turbine end
    # is inside the drive-time area (0012). turbine_buildable_acres is the turbine parcel's
    # buildable ground, turbine_gentle_acres its gently sloped ground, and
    # nearest_buildable_m how far the nearest buildable ground is from the turbine end
    # (0013). turbine_prime_acres, turbine_statewide_acres, turbine_capable_acres (capability
    # class 1 to turbine_max_capability_class) and turbine_pasture_aum are the turbine
    # parcel's farmland (0014). `factors` is JSON text: each
    # factor's value, sub-score, weight and contribution, for the click popup.
    latest_hydro_scores:
      schema: public
      table: latest_hydro_scores
      srid: 4326
      geometry_column: geom
      geometry_type: MULTILINESTRING
      id_column: corridor_id
      properties:
        score_run_id: int8
        nhdplusid: int8
        stream_name: text
        status: text
        tier: text
        rank: int4
        tier_rank: int4
        hydro_score: float8
        head_subscore: float8
        power_subscore: float8
        net_head_ft: float8
        firm_power_w: float8
        firm_flow_cfs: float8
        flow_method: text
        flow_confidence: text
        summary: text
        flow_flags: text
        flow_reference_gauge: text
        factors: text
        head_method: text
        corridor_length_m: float8
        reach_length_m: float8
        reach_drop_m: float8
        aoi_key: text
        aoi_name: text
        turbine_parcel_id: text
        turbine_parcel_acres: float8
        turbine_parcel_deed_acres: float8
        turbine_parcel_distance_m: float8
        parcels_crossed: int4
        turbine_flood_zone: text
        turbine_flood_subtype: text
        turbine_in_sfha: bool
        stretch_sfha_m: float8
        turbine_road_m: float8
        turbine_road_class: text
        turbine_road_name: text
        turbine_public_road_m: float8
        drive_minutes: float8
        drive_km: float8
        in_drive_area: bool
        turbine_buildable_acres: float8
        turbine_gentle_acres: float8
        nearest_buildable_m: float8
        turbine_prime_acres: float8
        turbine_statewide_acres: float8
        turbine_capable_acres: float8
        turbine_max_capability_class: int2
        turbine_pasture_aum: float8
