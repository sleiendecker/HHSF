[project]
name = "hhsf"
version = "0.1.0"
description = "Hydro Homestead Site Finder: find and rank micro-hydro homestead sites"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "shapely>=2.0",
    "sqlalchemy>=2.0",
    "typer>=0.12",
]

[project.scripts]
hhsf = "hhsf.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hhsf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Docker (spins up a throwaway PostGIS)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
