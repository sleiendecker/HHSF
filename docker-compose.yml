# Local services. Start with `make up` (it runs migrations before the tile server).
# The fixed project name makes every checkout of the repo (including git worktrees)
# share one database and tile server instead of starting a second set on the same ports.
name: hydro-homestead
services:
  db:
    # Multi-arch build of the official PostGIS image (native on Apple Silicon and x86).
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: hhsf
      POSTGRES_PASSWORD: hhsf
      POSTGRES_DB: hhsf
    ports:
      - "5433:5432"   # 5433 on the host so it won't clash with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hhsf -d hhsf"]
      interval: 2s
      timeout: 3s
      retries: 30

  tiles:
    # Serves PostGIS tables as vector tiles for the map.
    image: ghcr.io/maplibre/martin:1.16.1
    command: ["--config", "/config/martin.yaml"]
    environment:
      DATABASE_URL: postgresql://hhsf:hhsf@db:5432/hhsf
    ports:
      - "3100:3000"
    volumes:
      - ./martin:/config:ro
    depends_on:
      db:
        condition: service_healthy

  routing:
    # Valhalla, the drive-time engine (PART 16). Not started by `make up`: run `make routing`.
    # The first start downloads OpenStreetMap for Tennessee, Georgia and Alabama (~0.7 GB)
    # into data/valhalla/ and builds a road graph from it (5-30 min); later starts reuse it.
    # To rebuild from fresh OpenStreetMap data, empty data/valhalla/ and run `make routing`.
    image: ghcr.io/valhalla/valhalla-scripted:3.9.1
    environment:
      tile_urls: >-
        https://download.geofabrik.de/north-america/us/tennessee-latest.osm.pbf
        https://download.geofabrik.de/north-america/us/georgia-latest.osm.pbf
        https://download.geofabrik.de/north-america/us/alabama-latest.osm.pbf
      use_tiles_ignore_pbf: "True"
      build_tar: "True"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "False"
      build_transit: "False"
      server_threads: "4"
    ports:
      - "8002:8002"
    volumes:
      - ./data/valhalla:/custom_files
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8002/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 1h

volumes:
  pgdata:
